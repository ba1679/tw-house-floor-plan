<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">平面圖教學分享圖</title>
  <desc id="desc">簡化的台灣住宅平面圖線稿，搭配平面圖教學網站名稱與說明。</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <g transform="translate(84 78)">
    <rect x="0" y="0" width="420" height="420" rx="24" fill="#f5f5f5"/>
    <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M72 72H348V348H72V72Z" stroke="#2b2b2b" stroke-width="18"/>
      <path d="M72 188H212V72M212 188H348M212 188V348M72 264H212" stroke="#a8a8a8" stroke-width="14"/>
      <path d="M106 188A58 58 0 0 1 164 130" stroke="#4a4a4a" stroke-width="8"/>
      <path d="M276 348A62 62 0 0 1 338 286" stroke="#4a4a4a" stroke-width="8"/>
      <path d="M270 72V114M294 72V114M318 72V114" stroke="#4a4a4a" stroke-width="7"/>
      <path d="M104 292H168V330H104V292Z" stroke="#8a8a8a" stroke-width="6"/>
      <path d="M260 224H318V258H260V224Z" stroke="#8a8a8a" stroke-width="6"/>
      <path d="M272 120H326V158H272V120Z" stroke="#8a8a8a" stroke-width="6"/>
    </g>
  </g>
  <g transform="translate(565 152)" fill="#2b2b2b">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', sans-serif" font-size="74" font-weight="700">平面圖教學</text>
    <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', sans-serif" font-size="35" font-weight="600">看懂建案平面圖上的符號</text>
    <text x="0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#767676">點圖上的符號，就知道它是什麼、該注意什麼，</text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', sans-serif" font-size="28" font-weight="400" fill="#767676">以及這個說法出自哪一級文件。</text>
  </g>
</svg>
