<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --paper: oklch(0.974 0.009 85);
      --paper2: oklch(0.948 0.011 85);
      --ink: oklch(0.235 0.012 70);
      --ink2: oklch(0.455 0.014 70);
      --ink3: oklch(0.6 0.012 75);
      --rule: oklch(0.84 0.012 80);
      --rule2: oklch(0.905 0.011 82);
      --fp-paper: #ffffff;
      --fp-room: oklch(0.967 0 0);
      --fp-room-wet: oklch(0.935 0 0);
      --fp-room-balcony: oklch(0.985 0 0);
      --fp-wall: #a8a8a8;
      --fp-column: #585858;
      --fp-structure: #2b2b2b;
      --fp-line: #4a4a4a;
      --fp-text: #2b2b2b;
      --fp-muted: #767676;
      --fp-furn: #ffffff;
      --fp-furn-line: #8a8a8a;
      --state-normal-fill: oklch(0.965 0.018 250);
      --state-normal-stroke: oklch(0.44 0.15 256);
      --state-candidate-fill: oklch(0.905 0.045 250);
      --state-candidate-stroke: oklch(0.44 0.15 256);
      --state-selected-fill: oklch(0.82 0.085 252);
      --state-selected-stroke: oklch(0.44 0.15 256);
      --state-highlighted-fill: oklch(0.85 0.17 90);
      --state-highlighted-stroke: oklch(0.45 0.1 65);
      --state-revealed-stroke: oklch(0.45 0.1 65);
      --state-casing: #ffffff;
      --mark-circle-stroke: oklch(0.44 0.15 256);
      --mark-check-stroke: oklch(0.2 0 0);
      --focus-dark: #000000;
      --focus-light: #ffffff;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    }
    html, body { margin: 0; background: var(--paper); }
    body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    p, h1, h2, h3 { margin: 0; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--ink2); }
    button { font: inherit; color: inherit; }
    .st-normal-fill{fill:var(--state-normal-fill);stroke:none}
    .st-normal-stroke{fill:none;stroke:var(--state-normal-stroke);stroke-width:1px}
    .st-candidate-fill{fill:var(--state-candidate-fill);stroke:none}
    .st-candidate-stroke{fill:none;stroke:var(--state-candidate-stroke);stroke-width:2px}
    .st-selected-fill{fill:var(--state-selected-fill);stroke:none}
    .st-selected-stroke{fill:none;stroke:var(--state-selected-stroke);stroke-width:3px}
    .st-selected-casing{stroke-width:1.5px}
    .st-highlighted-fill{fill:var(--state-highlighted-fill);stroke:none}
    .st-highlighted-stroke{fill:none;stroke:var(--state-highlighted-stroke);stroke-width:2px}
    .st-casing{fill:none;stroke:var(--state-casing)}
    .st-revealed-stroke{fill:none;stroke:var(--state-revealed-stroke);stroke-width:3px;stroke-linecap:square}
    .st-revealed-casing{stroke-width:6px;stroke-linecap:square}
    .mark-circle{fill:none;stroke:var(--mark-circle-stroke);stroke-width:1.5px}
    .mark-check-ink{fill:none;stroke:var(--mark-check-stroke);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-ink-casing{fill:none;stroke:var(--state-casing);stroke-width:7px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large{fill:none;stroke:var(--mark-check-stroke);stroke-width:4px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large-casing{fill:none;stroke:var(--state-casing);stroke-width:9px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-stamp-disc{fill:var(--mark-check-stroke);stroke:var(--state-casing);stroke-width:2px}
    .mark-check-stamp-tick{fill:none;stroke:var(--state-casing);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round}
    .focus-light{fill:none;stroke:var(--focus-light);stroke-width:6px}
    .focus-dark{fill:none;stroke:var(--focus-dark);stroke-width:2px}
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 812px; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--sans);">
  <main style="flex: 1 1 0; min-height: 0; overflow: hidden; padding: 28px 20px 40px;">
    <article style="display: flex; flex-direction: column; gap: 24px;">
      <p style="margin: 0; font-size: 12px; line-height: 1.5; letter-spacing: 0.06em; color: var(--ink2);">家具家配 / FURNITURE</p>
      <h1 style="margin: -14px 0 0; font-size: 26px; line-height: 1.45; font-weight: 700;">平面圖上的馬桶是什麼？</h1>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 2px solid var(--ink); background: var(--paper2);">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--paper);"><svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round;"><path d="M10 5.2v11.3"></path><path d="M10 5.2C8 3.7 5.6 3.3 3 3.6v11.2c2.6-.3 5 .1 7 1.7"></path><path d="M10 5.2c2-1.5 4.4-1.9 7-1.6v11.2c-2.6-.3-5 .1-7 1.7"></path></svg></span>
          <span style="font-size: 14px; line-height: 1.4; font-weight: 700; letter-spacing: 0.04em;">CNS 標準</span>
        </div>
        <p style="margin: 0; font-size: 14px; line-height: 1.8; color: var(--ink2);">此符號的畫法在中華民國國家標準中有明文規定。</p>
      </div>
      <figure style="margin: 0; display: flex; justify-content: center; padding: 24px 20px; background: var(--fp-paper); border: 1px solid var(--rule);">
        <img src="sym-toilet.svg" alt="馬桶的符號圖形" style="display: block; width: 100%; max-width: 180px; height: auto;">
      </figure>
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 12px; line-height: 1.5; font-weight: 600; letter-spacing: 0.08em; color: var(--ink2);">白話意思<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: var(--rule);"></span></h2>
        <p style="margin: 0; font-size: 15.5px; line-height: 1.9;">坐式馬桶。平面圖上畫成上方一個圓角矩形（水箱）加下方一個橢圓（座體），是判斷一個空間是不是廁所最直接的線索。</p>
      </section>
      <section style="display: flex; flex-direction: column; gap: 8px;">
        <h2 style="display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 12px; line-height: 1.5; font-weight: 600; letter-spacing: 0.08em; color: var(--ink2);">容易搞混<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: var(--rule);"></span></h2>
        <div style="border-top: 1px solid var(--rule2); padding-top: 4px;">
          <a href="#" style="display: flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 700; color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px;">跟洗手台的差別</a>
          <p style="margin: 0; font-size: 14.5px; line-height: 1.85; color: var(--ink2);">兩者都是衛浴裡的圓弧狀器具，差別在有沒有水箱——馬桶上方多一個圓角矩形。</p>
        </div>
      </section>
    </article>
  </main>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
