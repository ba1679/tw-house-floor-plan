<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --paper: oklch(1 0 0);
      --paper2: oklch(0.962 0.002 265);
      --ink: oklch(0.21 0.006 265);
      --ink2: oklch(0.47 0.008 265);
      --ink3: oklch(0.62 0.006 265);
      --rule: oklch(0.89 0.003 265);
      --rule2: oklch(0.935 0.002 265);
      --fp-paper: #ffffff;
      --fp-room: oklch(0.967 0 0);
      --fp-room-wet: oklch(0.935 0 0);
      --fp-room-balcony: oklch(0.985 0 0);
      --fp-wall: #a8a8a8;
      --fp-column: #585858;
      --fp-structure: #2b2b2b;
      --fp-line: #4a4a4a;
      --fp-text: #2b2b2b;
      --fp-muted: #767676;
      --fp-furn: #ffffff;
      --fp-furn-line: #8a8a8a;
      --state-normal-fill: oklch(0.965 0.018 250);
      --state-normal-stroke: oklch(0.44 0.15 256);
      --state-candidate-fill: oklch(0.905 0.045 250);
      --state-candidate-stroke: oklch(0.44 0.15 256);
      --state-selected-fill: oklch(0.82 0.085 252);
      --state-selected-stroke: oklch(0.44 0.15 256);
      --state-highlighted-fill: oklch(0.85 0.17 90);
      --state-highlighted-stroke: oklch(0.45 0.1 65);
      --state-revealed-stroke: oklch(0.45 0.1 65);
      --state-casing: #ffffff;
      --mark-circle-stroke: oklch(0.44 0.15 256);
      --mark-check-stroke: oklch(0.2 0 0);
      --focus-dark: #000000;
      --focus-light: #ffffff;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    }
    html, body { margin: 0; background: var(--paper); }
    body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    p, h1, h2, h3 { margin: 0; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--ink2); }
    button { font: inherit; color: inherit; }
    .st-normal-fill{fill:var(--state-normal-fill);stroke:none}
    .st-normal-stroke{fill:none;stroke:var(--state-normal-stroke);stroke-width:1px}
    .st-candidate-fill{fill:var(--state-candidate-fill);stroke:none}
    .st-candidate-stroke{fill:none;stroke:var(--state-candidate-stroke);stroke-width:2px}
    .st-selected-fill{fill:var(--state-selected-fill);stroke:none}
    .st-selected-stroke{fill:none;stroke:var(--state-selected-stroke);stroke-width:3px}
    .st-selected-casing{stroke-width:1.5px}
    .st-highlighted-fill{fill:var(--state-highlighted-fill);stroke:none}
    .st-highlighted-stroke{fill:none;stroke:var(--state-highlighted-stroke);stroke-width:2px}
    .st-casing{fill:none;stroke:var(--state-casing)}
    .st-revealed-stroke{fill:none;stroke:var(--state-revealed-stroke);stroke-width:3px;stroke-linecap:square}
    .st-revealed-casing{stroke-width:6px;stroke-linecap:square}
    .mark-circle{fill:none;stroke:var(--mark-circle-stroke);stroke-width:1.5px}
    .mark-check-ink{fill:none;stroke:var(--mark-check-stroke);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-ink-casing{fill:none;stroke:var(--state-casing);stroke-width:7px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large{fill:none;stroke:var(--mark-check-stroke);stroke-width:4px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large-casing{fill:none;stroke:var(--state-casing);stroke-width:9px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-stamp-disc{fill:var(--mark-check-stroke);stroke:var(--state-casing);stroke-width:2px}
    .mark-check-stamp-tick{fill:none;stroke:var(--state-casing);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round}
    .focus-light{fill:none;stroke:var(--focus-light);stroke-width:6px}
    .focus-dark{fill:none;stroke:var(--focus-dark);stroke-width:2px}
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 812px; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--sans);">
  <main style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 16px; overflow: hidden;">
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px;">
      <h1 style="margin: 0; font-size: 24px; line-height: 32px; font-weight: 700;">三房兩廳找找看</h1>
      
    </div>
    <div style="flex: none; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 10px; margin: 0 0 12px;">
      <p style="margin: 0; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums;">第 3 / 7 題</p>
      <p style="margin: 0; font-size: 17px; line-height: 1.5;">找出這張圖上的<strong style="font-weight: 700;">一般單開門</strong></p>
    </div>
    <div style="position: relative; flex: none; width: 343px; height: 359.91px; overflow: hidden; background: var(--fp-paper); border-radius: 16px; box-shadow: 0 0 0 1px var(--rule);">
      <img src="plan.svg" alt="" style="position: absolute; left: 0px; top: 0px; width: 343px; height: 359.91px; max-width: none;">
      <svg width="343" height="359.91" viewBox="0 0 343 359.91" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply;"><rect class="st-selected-fill" x="89.69" y="210.61" width="25.79" height="6.88"></rect></svg>
      <svg width="343" height="359.91" viewBox="0 0 343 359.91" style="position: absolute; left: 0; top: 0;"><path class="st-casing st-revealed-casing" d="M107.54 251.22V242.22H115.48M115.48 242.22H123.42V251.22M123.42 262.28V271.28H115.48M115.48 271.28H107.54V262.28"></path><path class="st-revealed-stroke" d="M107.54 251.22V242.22H115.48M115.48 242.22H123.42V251.22M123.42 262.28V271.28H115.48M115.48 271.28H107.54V262.28"></path><path class="st-casing st-revealed-casing" d="M197.23 214.05V206.11H206.23M223.02 206.11H232.02V214.05M232.02 214.05V221.99H223.02M206.23 221.99H197.23V214.05"></path><path class="st-revealed-stroke" d="M197.23 214.05V206.11H206.23M223.02 206.11H232.02V214.05M232.02 214.05V221.99H223.02M206.23 221.99H197.23V214.05"></path><path class="st-casing st-revealed-casing" d="M229.9 214.05V206.11H238.9M249.96 206.11H258.96V214.05M258.96 214.05V221.99H249.96M238.9 221.99H229.9V214.05"></path><path class="st-revealed-stroke" d="M229.9 214.05V206.11H238.9M249.96 206.11H258.96V214.05M258.96 214.05V221.99H249.96M238.9 221.99H229.9V214.05"></path><path class="st-casing st-revealed-casing" d="M256.55 214.05V206.11H265.55M282.34 206.11H291.34V214.05M291.34 214.05V221.99H282.34M265.55 221.99H256.55V214.05"></path><path class="st-revealed-stroke" d="M256.55 214.05V206.11H265.55M282.34 206.11H291.34V214.05M291.34 214.05V221.99H282.34M265.55 221.99H256.55V214.05"></path><rect class="st-casing st-selected-casing" x="85.94" y="206.86" width="33.29" height="14.38"></rect><rect class="st-selected-stroke" x="88.19" y="209.11" width="28.79" height="9.88"></rect><path class="mark-check-large-casing" d="M127.48 198.61L135.08 206.21L147.48 191.41"></path><path class="mark-check-large" d="M127.48 198.61L135.08 206.21L147.48 191.41"></path></svg>
    </div>
    <p style="flex: none; margin: 12px 0 0; font-size: 15px; line-height: 24px; color: var(--ink2);">答對了。</p>
    <div style="flex: none; display: flex; gap: 8px; margin-top: 12px;">
      <button type="button" style="min-height: 48px; padding: 0 22px; border: none; border-radius: 12px; background: var(--ink); color: var(--paper); font-size: 16px; font-weight: 700; ">下一題</button>
      <button type="button" style="min-height: 48px; padding: 0 20px; border: none; border-radius: 12px; background: var(--paper2); color: var(--ink); font-size: 16px; font-weight: 600; ">看說明</button>
    </div>
  </main>
  <footer style="flex: none; margin-top: auto; background: var(--paper2);">
    <p style="margin: 0; padding: 10px 20px 12px; font-size: 12px; line-height: 1.7; color: var(--ink2);">本網站符號說明為一般通用慣例，不同建商 / 設計師畫法可能有差異，實際請以個案圖說或現場人員說明為準。</p>
  </footer>
</div>
</x-dc>

</body>
</html>
