<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --paper: oklch(0.974 0.009 85);
      --paper2: oklch(0.948 0.011 85);
      --ink: oklch(0.235 0.012 70);
      --ink2: oklch(0.455 0.014 70);
      --ink3: oklch(0.6 0.012 75);
      --rule: oklch(0.84 0.012 80);
      --rule2: oklch(0.905 0.011 82);
      --fp-paper: #ffffff;
      --fp-room: oklch(0.967 0 0);
      --fp-room-wet: oklch(0.935 0 0);
      --fp-room-balcony: oklch(0.985 0 0);
      --fp-wall: #a8a8a8;
      --fp-column: #585858;
      --fp-structure: #2b2b2b;
      --fp-line: #4a4a4a;
      --fp-text: #2b2b2b;
      --fp-muted: #767676;
      --fp-furn: #ffffff;
      --fp-furn-line: #8a8a8a;
      --state-normal-fill: oklch(0.965 0.018 250);
      --state-normal-stroke: oklch(0.44 0.15 256);
      --state-candidate-fill: oklch(0.905 0.045 250);
      --state-candidate-stroke: oklch(0.44 0.15 256);
      --state-selected-fill: oklch(0.82 0.085 252);
      --state-selected-stroke: oklch(0.44 0.15 256);
      --state-highlighted-fill: oklch(0.85 0.17 90);
      --state-highlighted-stroke: oklch(0.45 0.1 65);
      --state-revealed-stroke: oklch(0.45 0.1 65);
      --state-casing: #ffffff;
      --mark-circle-stroke: oklch(0.44 0.15 256);
      --mark-check-stroke: oklch(0.2 0 0);
      --focus-dark: #000000;
      --focus-light: #ffffff;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Segoe UI", "Microsoft JhengHei", "Noto Sans CJK TC", sans-serif;
    }
    html, body { margin: 0; background: var(--paper); }
    body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    p, h1, h2, h3 { margin: 0; }
    a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--ink2); }
    button { font: inherit; color: inherit; }
    .st-normal-fill{fill:var(--state-normal-fill);stroke:none}
    .st-normal-stroke{fill:none;stroke:var(--state-normal-stroke);stroke-width:1px}
    .st-candidate-fill{fill:var(--state-candidate-fill);stroke:none}
    .st-candidate-stroke{fill:none;stroke:var(--state-candidate-stroke);stroke-width:2px}
    .st-selected-fill{fill:var(--state-selected-fill);stroke:none}
    .st-selected-stroke{fill:none;stroke:var(--state-selected-stroke);stroke-width:3px}
    .st-selected-casing{stroke-width:1.5px}
    .st-highlighted-fill{fill:var(--state-highlighted-fill);stroke:none}
    .st-highlighted-stroke{fill:none;stroke:var(--state-highlighted-stroke);stroke-width:2px}
    .st-casing{fill:none;stroke:var(--state-casing)}
    .st-revealed-stroke{fill:none;stroke:var(--state-revealed-stroke);stroke-width:3px;stroke-linecap:square}
    .st-revealed-casing{stroke-width:6px;stroke-linecap:square}
    .mark-circle{fill:none;stroke:var(--mark-circle-stroke);stroke-width:1.5px}
    .mark-check-ink{fill:none;stroke:var(--mark-check-stroke);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-ink-casing{fill:none;stroke:var(--state-casing);stroke-width:7px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large{fill:none;stroke:var(--mark-check-stroke);stroke-width:4px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-large-casing{fill:none;stroke:var(--state-casing);stroke-width:9px;stroke-linecap:round;stroke-linejoin:round}
    .mark-check-stamp-disc{fill:var(--mark-check-stroke);stroke:var(--state-casing);stroke-width:2px}
    .mark-check-stamp-tick{fill:none;stroke:var(--state-casing);stroke-width:2.5px;stroke-linecap:round;stroke-linejoin:round}
    .focus-light{fill:none;stroke:var(--focus-light);stroke-width:6px}
    .focus-dark{fill:none;stroke:var(--focus-dark);stroke-width:2px}
  </style>
</helmet>
<div style="position: relative; width: 375px; height: 812px; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font-family: var(--sans); filter: grayscale(1);">
  <main style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; padding: 16px; overflow: hidden;">
    <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px;">
      <h1 style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 700;">三房兩廳</h1>
      <a href="#" style="flex: none; margin: -10px -12px; padding: 10px 12px; font-size: 14px; line-height: 24px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px;">找找看：你認得幾個？</a>
    </div>
    <div style="position: relative; flex: none; width: 343px; height: 334.5px; overflow: hidden; background: var(--fp-paper); box-shadow: 0 0 0 1px var(--rule);">
      <img src="plan-dim-balcony.svg" alt="" style="position: absolute; left: 12.11px; top: 0px; width: 318.79px; height: 334.5px; max-width: none;">
      <svg width="343" height="334.5" viewBox="0 0 343 334.5" style="position: absolute; left: 0; top: 0; mix-blend-mode: multiply;"><rect class="st-selected-fill" x="298.4" y="79.36" width="6.39" height="23.97"></rect></svg>
      <svg width="343" height="334.5" viewBox="0 0 343 334.5" style="position: absolute; left: 0; top: 0;"><rect class="st-casing st-selected-casing" x="294.65" y="75.61" width="13.89" height="31.47"></rect><rect class="st-selected-stroke" x="296.9" y="77.86" width="9.39" height="26.97"></rect></svg>
    </div>

    <p style="flex: none; margin: 12px 0 0; font-size: 14px; line-height: 24px; color: var(--ink2);">窗</p>
    <aside style="flex: none; height: 373.5px; display: flex; flex-direction: column; margin: 12px -16px -16px; background: var(--paper); border-top: 1px solid var(--ink);">
      <header style="flex: none; display: flex; align-items: center; gap: 12px; padding: 14px 8px 10px 20px;">
        <div style="flex-grow: 1; min-width: 0;">
          <h2 style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 700;">窗</h2>
          <p style="margin: 2px 0 0; font-size: 12px; line-height: 1.5; letter-spacing: 0.04em; color: var(--ink2);">門窗 / DOOR &amp; WINDOW</p>
        </div>
        <button type="button" aria-label="關閉說明" style="flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: none; background: none; color: var(--ink);"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; "><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      </header>
      <div style="position: relative; flex: 1 1 auto; min-height: 0; display: flex;">
        <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 0 20px 4px;">
          <div style="display: flex;">
          <span style="display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 5px 10px; border: 1px solid var(--ink3); background: transparent; color: var(--ink);">
            <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linejoin: round; stroke-linecap: round;"><path d="M3 16.5h14L3 3.5z"></path><path d="M6 14.2h3.4"></path></svg>
            <span style="font-size: 12px; line-height: 1.4; font-weight: 600; white-space: nowrap;">業界慣例</span>
            <span aria-hidden="true" style="flex: none; width: 1px; height: 12px; background: var(--rule);"></span>
            <span style="font-size: 12px; line-height: 1.4; color: var(--ink2);">各建商畫法可能不同</span>
          </span>
          </div>
          <section style="margin-top: 16px;">
            <h3 style="display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 12px; line-height: 1.5; font-weight: 600; letter-spacing: 0.08em; color: var(--ink2);">白話意思<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: var(--rule);"></span></h3>
            <p style="margin: 0; font-size: 15px; line-height: 1.8;">採光和通風用的開口，多半開在外牆。平面圖上牆會斷開、以一條窗框帶橫跨，框帶裡的線條畫法不同，開窗方式也不同。</p>
          </section>
          <section style="margin-top: 16px;">
            <h3 style="display: flex; align-items: center; gap: 10px; margin: 0 0 6px; font-size: 12px; line-height: 1.5; font-weight: 600; letter-spacing: 0.08em; color: var(--ink2);">容易搞混<span aria-hidden="true" style="flex: 1 1 auto; height: 1px; background: var(--rule);"></span></h3>
            <div style="display: flex; flex-direction: column; gap: 10px;">
              <div style="padding-top: 8px; border-top: 1px solid var(--rule2);">
                <p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 600;">跟推拉門的差別</p>
                <p style="margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink2);">畫法很像，差別在窗框帶——窗的開口被一條與牆等厚的框帶填滿，拉門沒有，門扇線落在牆面外側。</p>
              </div>
              <div style="padding-top: 8px; border-top: 1px solid var(--rule2);">
                <p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 600;">跟雨遮的差別</p>
                <p style="margin: 0; font-size: 14px; line-height: 1.75; color: var(--ink2);">雨遮就畫在窗的正外側，差別在建物輪廓線——窗嵌在牆裡，雨遮整個在輪廓線外面。</p>
              </div>
            </div>
          </section>
        </div>
        <button type="button" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; display: flex; align-items: flex-end; justify-content: center; gap: 6px; padding: 0 0 10px; border: none; background: linear-gradient(to bottom, color-mix(in oklch, var(--paper) 0%, transparent), var(--paper) 50%); font-size: 12px; font-weight: 600; color: var(--ink2);"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; "><path d="M6 15l6-6 6 6"></path></svg>上拉看完整內容</button>
      </div>
      <button type="button" style="flex: none; min-height: 56px; display: flex; align-items: center; gap: 12px; text-align: left; margin: 0 20px; padding: 6px 0; border: none; border-top: 1px solid var(--rule2); background: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; "><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
        <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
          <span style="font-size: 14px; font-weight: 600; line-height: 1.5;">看它在圖上的其他位置</span>
          <span style="font-size: 12px; line-height: 1.5; color: var(--ink2); font-variant-numeric: tabular-nums;">這張圖上共 9 處 · 目前第 4 處</span>
        </span>
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; "><path d="M9 5l7 7-7 7"></path></svg>
      </button>
      <p style="flex: none; margin: 0; padding: 10px 20px 12px; font-size: 12px; line-height: 1.7; color: var(--ink2); border-top: 1px solid var(--rule2);">本網站符號說明為一般通用慣例，不同建商 / 設計師畫法可能有差異，實際請以個案圖說或現場人員說明為準。</p>
    </aside>
  </main>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":375,"height":812}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
