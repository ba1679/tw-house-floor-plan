name: M5 release gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://floorplan.example.test
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-TEST12345

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Expose Chromium for Lighthouse
        run: echo "CHROME_PATH=$(node -e \"console.log(require('playwright').chromium.executablePath())\")" >> "$GITHUB_ENV"

      - name: Typecheck
        run: npm run typecheck

      - name: Build-time data validation
        run: |
          npm run validate
          npm run validate:floorplan

      - name: Production build
        run: npm run build

      - name: Playwright tests
        run: npm test

      - name: Lighthouse release audit
        run: npm run audit
